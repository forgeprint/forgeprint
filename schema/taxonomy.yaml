  commander: Commander
  hono: Hono
  express: Express
  fastify: Fastify
  nestjs: NestJS
  nextjs: Next.js
  react: React
  vue: Vue
  svelte: Svelte
  angular: Angular
  astro: Astro
  tailwind: Tailwind CSS
  vite: Vite
  # Go
  go: Go
  cobra: Cobra
  # Python
  python: Python
  typer: Typer
  celery: Celery
  langgraph: LangGraph
  django: Django
  fastapi: FastAPI
  flask: Flask
  # JVM
  spring-boot: Spring Boot
  ktor: Ktor
  # Other backends
