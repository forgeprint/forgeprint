# Forgeprint taxonomy — the controlled vocabularies every manifest.yaml draws from.
#
# Rules:
#   - These lists are closed. A manifest that uses a value not listed here fails
#     `forgeprint validate`.
#   - Extending the taxonomy is a separate pull request, reviewed on its own.
#     Do not add a term in the same pull request as the blueprint that needs it.
#   - Keys are the stable identifiers used in manifests, in the index, and in
#     resolver scoring. Values are display labels for the site; changing a label
#     is cosmetic, changing a key is a breaking change.
#   - Keys are lower kebab-case, ASCII only.
#   - Prefer an existing broader term over a new narrow one. A term earns its
#     place when a blueprint cannot be described without it.

version: 1

# Programming languages. The heaviest criterion in resolver scoring: a language
# the user already knows outranks every other signal.
languages:
  bash: Bash
  c: C
  cpp: C++
  csharp: C#
  dart: Dart
  elixir: Elixir
  go: Go
  java: Java
  javascript: JavaScript
  kotlin: Kotlin
  lua: Lua
  php: PHP
  python: Python
  ruby: Ruby
  rust: Rust
  scala: Scala
  sql: SQL
  swift: Swift
  typescript: TypeScript

# Frameworks, runtimes, engines, databases and infrastructure a blueprint builds
# on. Not a free-text keyword field.
stack:
  # .NET
  dotnet: .NET
  aspnetcore: ASP.NET Core
  efcore: Entity Framework Core
  blazor: Blazor
  maui: .NET MAUI
  # JavaScript and TypeScript
  node: Node.js
  express: Express
  fastify: Fastify
  nestjs: NestJS
  nextjs: Next.js
  react: React
  vue: Vue
  svelte: Svelte
  angular: Angular
  astro: Astro
  tailwind: Tailwind CSS
  vite: Vite
  # Python
  django: Django
  fastapi: FastAPI
  flask: Flask
  # JVM
  spring-boot: Spring Boot
  ktor: Ktor
  # Other backends
  rails: Ruby on Rails
  laravel: Laravel
  gin: Gin
  axum: Axum
  phoenix: Phoenix
  # Mobile
  flutter: Flutter
  react-native: React Native
  swiftui: SwiftUI
  jetpack-compose: Jetpack Compose
  # Games
  unity: Unity
  godot: Godot
  unreal: Unreal Engine
  bevy: Bevy
  # Data stores
  postgres: PostgreSQL
  mysql: MySQL
  sqlite: SQLite
  sqlserver: SQL Server
  mongodb: MongoDB
  redis: Redis
  # Platform and infrastructure
  docker: Docker
  kubernetes: Kubernetes
  terraform: Terraform
  github-actions: GitHub Actions
  aws: AWS
  azure: Azure
  gcp: Google Cloud
  cloudflare: Cloudflare
  vercel: Vercel
  # Agent tooling
  mcp: Model Context Protocol

# Where the built project runs.
platforms:
  ios: iOS
  android: Android
  web: Web
  windows: Windows
  macos: macOS
  linux: Linux
  docker: Docker
  cloud: Cloud

# How the built project reaches its users. Shapes the resolver as much as the
# stack does: a free ad-supported game and a paid enterprise tool need different
# setups even on the same engine.
distribution:
  free: Free
  ads: Ad-supported
  paid: Paid
  iap: In-app purchase
  open-source: Open source
  saas: SaaS
  internal: Internal

# What kind of thing is being built. One value per blueprint.
project_type:
  api: API service
  web: Web application
  mobile: Mobile application
  game: Game
  cli: Command-line tool
  lib: Library
  data: Data or analytics
  agent: AI agent or MCP server
  infra: Infrastructure

# Who the blueprint is written for.
audience:
  beginner: Beginner
  intermediate: Intermediate
  advanced: Advanced

# Cross-cutting capabilities the blueprint sets up. Answers "what do I need?",
# not "what is it built with" — that is `stack`.
requirements:
  auth: Authentication
  rbac: Role-based access control
  multi-tenant: Multi-tenancy
  payments: Payments
  realtime: Realtime updates
  offline: Offline support
  background-jobs: Background jobs
  caching: Caching
  search: Full-text search
  file-upload: File upload and storage
  email: Transactional email
  notifications: Push notifications
  i18n: Internationalization
  accessibility: Accessibility
  seo: SEO
  analytics: Product analytics
  observability: Logging, metrics and tracing
  rate-limiting: Rate limiting
  api-docs: API documentation
  testing: Automated testing
  ci: Continuous integration
  cd: Continuous delivery
  iac: Infrastructure as code
  containerization: Containerization
  monorepo: Monorepo layout
  migrations: Database migrations

# Coding agents a blueprint has been exercised with.
agents:
  claude-code: Claude Code
  codex: Codex
  copilot-cli: Copilot CLI
  cursor: Cursor
  gemini-cli: Gemini CLI
  windsurf: Windsurf

# Trust level. `verified` requires a maintainer to have run the setup; `official`
# is reserved for blueprints maintained by the core maintainer.
tier:
  community: Community
  verified: Verified
  official: Official

# Spellings that mean a value that is already here.
#
# Not new values: the vocabularies above are closed (rule 8). These are the
# words people actually write — "golang" for `go`, "k8s" for `kubernetes` — so
# that a profile written the way a person speaks still matches. Identifiers and
# labels are already understood without an entry here, ignoring case and the
# separators people vary on, so only genuinely different spellings belong.
aliases:
  languages:
    golang: go
    js: javascript
    ts: typescript
    py: python
    c-sharp: csharp
    dotnet: csharp
    .net: csharp
    node: javascript
    nodejs: javascript
    node-js: javascript
  stack:
    asp.net: aspnetcore
    aspnet: aspnetcore
    asp.net-core: aspnetcore
    entity-framework: efcore
    entity-framework-core: efcore
    ef: efcore
    psql: postgres
    mssql: sqlserver
    k8s: kubernetes
    gha: github-actions
    actions: github-actions
    next: nextjs
    nest: nestjs
    rn: react-native
    ue: unreal
  project_type:
    rest-api: api
    backend: api
    service: api
    website: web
    frontend: web
    library: lib
    package: lib
    tool: cli
    command-line: cli
    mcp-server: agent
    mcp: agent
  distribution:
    oss: open-source
    opensource: open-source
    subscription: saas
    b2b: saas
    in-app-purchase: iap
  requirements:
    authentication: auth
    authn: auth
    login: auth
    authz: rbac
    roles: rbac
    permissions: rbac
    multitenancy: multi-tenant
    multi-tenancy: multi-tenant
    tenancy: multi-tenant
    websockets: realtime
    real-time: realtime
    queues: background-jobs
    workers: background-jobs
    cron: background-jobs
    uploads: file-upload
    storage: file-upload
    smtp: email
    localization: i18n
    a11y: accessibility
    telemetry: observability
    logging: observability
    metrics: observability
    tracing: observability
    tests: testing
    docker: containerization
    containers: containerization
    infrastructure-as-code: iac
    terraform: iac
