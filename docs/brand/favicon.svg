<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The favicon opens the geometry up and thickens the stroke: at 16px the
    impression closes into a blob otherwise, and a blob is not a mark.
  -->
  <style>
    .fp { fill: #b8541a; stroke: #b8541a; }
    @media (prefers-color-scheme: dark) { .fp { fill: #ff9f57; stroke: #ff9f57; } }
  </style>
  <path class="fp" d="M12 11.5 22.5 17.5 12 23.5 1.5 17.5Z" fill="none" stroke-width="2.6" stroke-linejoin="round" opacity="0.6" />
  <path class="fp" d="M12 1.5 22.5 7.5 12 13.5 1.5 7.5Z" stroke="none" />
</svg>
