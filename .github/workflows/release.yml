# Publishing to npm from a tag, with no token anywhere.
#
# npm trusted publishing: the job asks GitHub for a short-lived OIDC token, npm
# checks it against a trusted publisher configured on npmjs.com, and attaches
# provenance by itself. Nothing here is a secret, so there is nothing to leak,
# nothing to expire between releases, and no way to end up with the stage-only
# token that `docs/releasing.md` §7 spends a page on.
#
# **The filename is load-bearing.** npm matches a trusted publisher on the
# organization, the repository and this file's *name* — `release.yml`, not its
# path — and every field is case-sensitive. Renaming this file breaks publishing
# until somebody edits the publisher on npmjs.com to match.
#
# §4 still holds: this is the convenient path, not the only one. Every step is a
# command that runs on a laptop, and `forgeprint release <version>` publishes
# without Actions at all. Actions being unavailable delays a release; it does
# not block one.
#
# Actions are pinned to full commit SHAs because a tag can be moved and a SHA
# cannot; the repository requires it. See docs/repo-settings.md.

name: release

on:
  push:
    tags: ['v*']
  # The rehearsal below, which needs no tag. It has to live in this file rather
  # than in a workflow of its own: npm matches the publisher on this file's
  # name, so a diagnostic anywhere else is refused for not matching and reports
  # "package not found" — the same words a missing publisher produces. One
  # workflow of mine did exactly that and could never have passed.
  workflow_dispatch:

# contents: read is all a publish needs — the tag and the release already exist
# by the time this runs, because pushing the tag is what started it.
permissions:
  contents: read
  id-token: write

# Never cancel a publish half-way. A cancelled `npm publish` is the one failure
# mode where the registry's state and the log disagree.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trusted publishing needs Node 22.14.0 or later. `22` resolves to the
      # newest 22.x, which has been past that since 22.14.0 itself.
      # No `registry-url`. Given one, setup-node writes an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}` and points NPM_CONFIG_USERCONFIG at it,
      # so npm finds an auth token already configured — an empty one, since
      # trusted publishing sets no NODE_AUTH_TOKEN — and sends that instead of
      # asking GitHub for an OIDC token. The exchange never happens and the
      # registry answers ENEEDAUTH. 0.4.0's publish step failed on this job with
      # npm's own output discarded, so this is the leading suspect rather than a
      # proved cause; the discarding is fixed in the same pull request.
      # registry.npmjs.org is npm's default, so nothing is lost by omitting it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Node 22 bundles npm 10, and trusted publishing needs 11.5.1 or later —
      # so the bundled one cannot do this at all. pnpm is pinned to the version
      # `packageManager` names, as everywhere else.
      - name: Install npm and pnpm
        run: npm install --global npm@12.2.0 pnpm@12.5.1

      # Everything from here is one of two paths: a tag publishes, a manual run
      # rehearses and publishes nothing.

      # What the environment has, printed as presence and never as values —
      # the request token is a credential (§5b).
      - name: Report the publish environment
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -u
          set_or_not() { if [ -n "${1:-}" ]; then echo yes; else echo no; fi; }
          echo "node:                 $(node -v)"
          echo "npm:                  $(npm -v)"
          echo "request url set:      $(set_or_not "${ACTIONS_ID_TOKEN_REQUEST_URL:-}")"
          echo "request token set:    $(set_or_not "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}")"
          echo "npm userconfig:       ${NPM_CONFIG_USERCONFIG:-unset}"
          echo "auth lines in effect: $(npm config list 2>/dev/null | grep -c authToken || true)"

      # The exchange itself, with nothing at stake.
      #
      # A version npmjs.com already serves cannot be published over — that is
      # immutable — so npm authenticates first and is then refused for the
      # version rather than for the credentials. The two refusals are the
      # answer:
      #
      #   E403 "cannot publish over the previously published versions"
      #        the exchange worked. This is the pass.
      #   404 on .../oidc/token/exchange/package/<name>, then ENEEDAUTH
      #        no publisher on that package matches this repository and this
      #        workflow filename.
      #
      # Nothing is published either way and no version number is spent.
      # Two packages and two npm majors, because one failing run cannot tell a
      # per-package configuration problem from an account-wide or client-side
      # one, and that is the question left after the fields on npmjs.com were
      # confirmed correct.
      #
      #   both packages fail the same way -> not the per-package publisher
      #   one fails, one passes          -> that package's publisher
      #   npm 11 passes where 12 fails   -> the client, not the configuration
      - name: Rehearse the exchange
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          rehearse() {
            echo "::group::$1@$2 with npm $(npm -v)"
            npm pack "$1@$2" >/dev/null 2>&1 || { echo "pack failed"; echo '::endgroup::'; return; }
            npm publish "$1-$2.tgz" --access public --loglevel verbose 2>&1 |
              grep -iE "oidc|token/exchange|ENEEDAUTH|E403|cannot publish|previously published" |
              head -8
            echo '::endgroup::'
          }
          rehearse forgeprint 0.3.1
          rehearse forgeprint-mcp 0.3.1
          npm install --global npm@11 >/dev/null 2>&1
          rehearse forgeprint 0.3.1

      # The MCP Registry's side of the same question, and the reason this step
      # exists at all: `mcp-publisher login github-oidc` takes no arguments.
      # Inside Actions it authenticates as the repository, so the registry step
      # would need no credential on anybody's laptop — the same answer as npm
      # trusted publishing.
      #
      # Six interactive attempts with a personal access token produced three
      # logins that reported success and granted `io.github.<person>/*`, never
      # the organization namespace `server.json` needs. What the registry
      # grants is readable from the token it stores, so this reads it and
      # publishes nothing:
      #
      #   permissions includes io.github.forgeprint/*  -> move the registry
      #                                                   step into this
      #                                                   workflow and no
      #                                                   token is ever made
      #   only io.github.<person>/* , or login fails   -> OIDC is not the
      #                                                   answer either, and
      #                                                   the namespace itself
      #                                                   is what to fix
      #
      # mcp-publisher is pinned, and the download is checked against the digest
      # its own signature bundle carries rather than trusted because it came
      # from a release page.
      - name: Rehearse the MCP Registry login over OIDC
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_VERSION: 1.8.1
        run: |
          A="mcp-publisher_linux_amd64.tar.gz"
          gh release download "v${MCP_PUBLISHER_VERSION}" \
            --repo modelcontextprotocol/registry --pattern "$A" --pattern "$A.sigstore.json"
          signed=$(node -p "require('./$A.sigstore.json').messageSignature.messageDigest.digest")
          actual=$(sha256sum "$A" | cut -d' ' -f1 | xxd -r -p | base64)
          test "$signed" = "$actual" || { echo "digest mismatch"; exit 1; }
          tar -xzf "$A" mcp-publisher
          ./mcp-publisher --version

          ./mcp-publisher login github-oidc
          # Claims only. The token itself is a credential (§5b).
          node -e "
            const j = require(process.env.HOME + '/.config/mcp-publisher/token.json');
            const p = JSON.parse(Buffer.from(j.token.split('.')[1], 'base64url').toString());
            console.log('granted to:', p.auth_method_sub, 'via', p.auth_method);
            console.log('permissions:', JSON.stringify(p.permissions));
            console.log('lifetime:', p.exp - p.iat, 'seconds');
          "

      - name: Install dependencies
        if: github.event_name == 'push'
        run: pnpm install --frozen-lockfile

      # A tag can point at any commit, including one that never passed a pull
      # request. The gate runs again rather than being assumed.
      - name: Check
        if: github.event_name == 'push'
        run: pnpm run check

      # `${GITHUB_REF_NAME#v}` turns v0.3.1 into 0.3.1. Everything else — which
      # packages, in what order, which are already served, and what each npm
      # error means — is in the command, not in this file (ADR 0002), so a
      # maintainer gets the same answer locally.
      - name: Publish
        if: github.event_name == 'push'
        run: pnpm forgeprint publish "${GITHUB_REF_NAME#v}" --trusted
