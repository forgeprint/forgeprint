# Does this repository's Actions environment have what npm trusted publishing
# needs? Nothing else, and nothing published.
#
# Two releases were burned finding this out the expensive way. `release.yml`
# only runs from a tag, so every hypothesis about why `npm publish` answered
# ENEEDAUTH cost a version number — and `npm publish --dry-run` does not
# authenticate, so it proves nothing about the exchange.
#
# This answers the two questions that do not need a publish:
#   - which npm actually runs (trusted publishing needs 11.5.1 or later, and
#     Node 22 bundles npm 10, which cannot do it at all);
#   - whether the OIDC request variables are present, which is what
#     `id-token: write` is for. Without them npm has nothing to exchange and
#     says ENEEDAUTH, which reads exactly like a missing login.
#
# It prints whether the variables are set, never their values: the request
# token is a credential.
#
# It also rehearses the exchange itself, against a version npmjs.com already
# serves. That cannot be published over, so npm must authenticate and then be
# refused for the version rather than the credentials — which is a pass with
# nothing published and no version number spent.

name: oidc-check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install npm
        run: npm install --global npm@12.2.0

      - name: Report
        run: |
          set -u
          # `${VAR:+yes}${VAR:-no}` looks like a ternary and is not: when VAR is
          # set, the second expansion yields VAR itself, so the first run of this
          # printed the request URL it promised to withhold. One run's endpoint,
          # useless without the token the runner masks — but the file said it
          # printed presence, so now it does.
          set_or_not() { if [ -n "${1:-}" ]; then echo yes; else echo no; fi; }
          echo "node:                 $(node -v)"
          echo "npm:                  $(npm -v)"
          echo "npm resolves to:      $(command -v npm)"
          echo "request url set:      $(set_or_not "${ACTIONS_ID_TOKEN_REQUEST_URL:-}")"
          echo "request token set:    $(set_or_not "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}")"
          echo "npm userconfig:       ${NPM_CONFIG_USERCONFIG:-unset}"
          echo "auth lines in effect: $(npm config list 2>/dev/null | grep -c authToken || true)"

      # The exchange itself, with nothing at stake.
      #
      # A version npmjs.com already serves cannot be published over — that is
      # immutable. So npm has to authenticate first and then be refused for the
      # version rather than for the credentials, and the two refusals are the
      # answer:
      #
      #   E403 "cannot publish over the previously published versions" —
      #        the OIDC exchange worked. This is the pass.
      #   ENEEDAUTH —
      #        npm never got a token. Same failure the releases hit.
      #
      # Nothing is published either way, and no version number is spent.
      - name: Rehearse the exchange against a version that already exists
        continue-on-error: true
        run: |
          npm pack forgeprint@0.3.1
          npm publish forgeprint-0.3.1.tgz --access public --loglevel verbose 2>&1 | tail -40

      # npm writes the OIDC attempt to its debug log and not to the terminal, so
      # this is the only place that says whether an exchange happened at all.
      - name: The npm debug log
        if: always()
        run: |
          log=$(ls -t "${HOME}"/.npm/_logs/*debug*.log 2>/dev/null | head -1)
          if [ -z "${log}" ]; then echo "no debug log"; exit 0; fi
          grep -iE "oidc|id.token|trusted|exchange|401|403|404|needauth" "${log}" | tail -40 || true
