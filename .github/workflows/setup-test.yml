# Running the recipes for real.
#
# This is the check the catalog's central claim rests on: a `setup.md` is a
# script, and a machine can follow it on an empty directory. Nothing else in CI
# can tell you that.
#
# It runs on a runner rather than inside a container, because the recipes build
# and run containers themselves — see docs/decisions/0005-setup-test-environment.md.
#
# The runner provides the toolchain. `forgeprint test-setup` checks what each
# blueprint declares in `requires_tools` and refuses to run if something is
# missing, naming it. So a blueprint in a language this job does not install
# fails with a readable message, and the fix is a step here.
#
# There is no `paths:` filter on pull requests, on purpose. This is a required
# status check, and a check that is filtered away never reports at all, which
# leaves the pull request waiting for something that will never arrive. Instead
# the job always runs and `--changed-since` decides what there is to do; a pull
# request that touches no blueprint says so and passes in under a minute.

name: setup-test

on:
  # While the catalog is bootstrapped, blueprints land on main directly, so the
  # pull request trigger alone would never fire.
  push:
    branches: [main]
    paths:
      - 'blueprints/**'
      - 'packages/cli/**'
      - '.github/workflows/setup-test.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      all-options:
        description: 'Run every option combination rather than one per blueprint'
        type: boolean
        default: true
  schedule:
    # Recipes rot from the outside: a package is yanked, an image tag moves, an
    # advisory appears. Monday morning, before anyone relies on them.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: setup-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-test:
    runs-on: ubuntu-latest
    # A recipe builds projects and images; the default is far too tight.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `--changed-since` diffs against the base branch, which has to be
          # in the clone for that to be possible.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The toolchain today's catalog declares. Docker is already on the runner,
      # and Node arrives with setup-node above.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Go is on the runner, but an older one than the catalog needs: gin
      # 1.12 requires 1.25 and the image ships 1.24. The tool check refuses
      # rather than building with the wrong toolchain, which is correct and
      # means the version has to be pinned here.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25'

      # Terraform is not on the runner at all. `terraform_wrapper: false`
      # because the wrapper rewrites stdout, and a recipe that reads
      # `terraform show -json` gets the wrapper's annotations instead of JSON.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      # The toolchains the 2026-09-24 expansion plan brings in: Java, PHP,
      # Ruby, Rust, Flutter, Elixir and uv. Each is the current stable or LTS
      # line as read on 2026-09-24, pinned so that `requires_tools` is checked
      # against a known version rather than whatever the image carries. The
      # Android SDK and Chrome are already on ubuntu-latest.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2

      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '4.0'

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: '1.98.1'
          components: clippy, rustfmt

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'

      - name: Install pnpm
        run: npm install --global pnpm@12.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the tooling
        run: pnpm run build

      # A pull request runs the blueprints it changed, in one combination each:
      # the first value of every option, deterministically. The full matrix is
      # slow enough that making it the default would mean nobody waits for it,
      # so it runs on Mondays and on demand.
      - name: Run the recipes this pull request changes
        if: github.event_name == 'pull_request'
        env:
          # Through the environment rather than into the command line: the base
          # branch is a name from the repository, and this keeps it a value.
          BASE_REF: ${{ github.base_ref }}
        run: pnpm forgeprint test-setup --all --changed-since "origin/$BASE_REF"

      - name: Run every option combination
        if: github.event_name != 'pull_request'
        run: pnpm forgeprint test-setup --all --all-options
