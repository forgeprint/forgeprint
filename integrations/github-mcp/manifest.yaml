  gemini-cli: "gemini mcp add github https://api.githubcopilot.com/mcp/ --transport http --header 'Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}'"
needs_secrets: [GITHUB_PERSONAL_ACCESS_TOKEN]
permissions_summary: 'Reads and writes every repository the token can reach: issues, pull requests, workflow runs and file contents.'
fits: [software, devops, product]
agents: [claude-code]
