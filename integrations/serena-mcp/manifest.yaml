install:
  claude-code: 'claude mcp add-json serena ''{"command":"uvx","args":["-p","3.13","--from","serena-agent==1.7.0","serena","start-mcp-server","--context","claude-code","--project-from-cwd","--open-web-dashboard","false"],"env":{"SERENA_USAGE_REPORTING":"false"}}'''
  codex: 'codex mcp add serena --env "SERENA_USAGE_REPORTING=false" -- uvx -p 3.13 --from serena-agent==1.7.0 serena start-mcp-server --context codex --project-from-cwd --open-web-dashboard false'
  gemini-cli: 'gemini mcp add serena -e "SERENA_USAGE_REPORTING=false" uvx -p 3.13 --from serena-agent==1.7.0 serena start-mcp-server --context ide --project-from-cwd --open-web-dashboard false'
permissions_summary: 'Reads and edits code in the project it starts in (replacing, inserting and renaming symbols, rewriting file content) and writes its own .serena folder there; the contexts used here leave out its shell command tool.'
fits: [software]
agents: [claude-code]
