schema: 1
slug: grafana-mcp
name: 'Grafana MCP'
version: 1.0.0
tier: community
provenance: generated
maintainers: [aliosmanmho]
summary: 'Search dashboards, query Prometheus and Loki, and read alerts and incidents in Grafana, with every write tool switched off.'
kind: mcp
upstream: https://github.com/grafana/mcp-grafana
upstream_version: '1.5.1'
verified_on: 2026-09-24
install:
  claude-code: 'claude mcp add-json grafana ''{"command":"uvx","args":["mcp-grafana==1.5.1","--disable-write","--usage-stats=disabled"],"env":{"GRAFANA_URL":"${GRAFANA_URL}","GRAFANA_SERVICE_ACCOUNT_TOKEN":"${GRAFANA_SERVICE_ACCOUNT_TOKEN}"}}'''
  codex: 'codex mcp add grafana --env "GRAFANA_URL=$GRAFANA_URL" --env "GRAFANA_SERVICE_ACCOUNT_TOKEN=$GRAFANA_SERVICE_ACCOUNT_TOKEN" -- uvx mcp-grafana==1.5.1 --disable-write --usage-stats=disabled'
  gemini-cli: "gemini mcp add grafana -e 'GRAFANA_URL=$GRAFANA_URL' -e 'GRAFANA_SERVICE_ACCOUNT_TOKEN=$GRAFANA_SERVICE_ACCOUNT_TOKEN' uvx mcp-grafana==1.5.1 --disable-write --usage-stats=disabled"
needs_secrets: [GRAFANA_URL, GRAFANA_SERVICE_ACCOUNT_TOKEN]
permissions_summary: 'Reads dashboards, datasources, alert rules, incidents and on-call data, and runs read queries against the datasources, in the Grafana instance the service account can reach; write tools are not registered.'
fits: [devops, software, operations]
agents: [claude-code]
deprecated: false
supersedes: null
