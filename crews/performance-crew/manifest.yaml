for_what: 'Profiling and fixing latency or throughput on a web application backed by PostgreSQL: the signals that show where time goes, Core Web Vitals in the browser, query plans and indexes in the database, and every change measured against a baseline.'
not_for: 'Feature work, correctness bugs, or a single slow query that is already identified. That is one sequential change for one expert, and a crew adds cost without adding a measurement.'
