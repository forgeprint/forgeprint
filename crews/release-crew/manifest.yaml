summary: 'A release cut the same way every time: a version derived from history, a gate whose red means stop, a rollout with a rollback somebody has run, and a watch on the error budget afterwards.'
byline: 'Assembled by @aliosmanmho'
members:
  - release-manager
  - devops-platform-engineer
  - site-reliability-engineer
  - qa-automation-lead
