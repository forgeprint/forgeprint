  - sentry-mcp
for_what: 'Cutting a release of a running service: version and changelog derived from the history, the release gate, a staged rollout with tested rollback criteria, and post-deploy checks against the SLO.'
not_for: 'Feature design, building infrastructure from nothing, or a routine patch release one agent can follow the release-manager checklist through in order. Sequential, small work is worse with more agents, not better.'
agents: [claude-code]
